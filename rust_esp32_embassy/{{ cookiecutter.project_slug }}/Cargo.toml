[package]
name = "{{ cookiecutter.project_slug }}"
edition = "2024"
resolver = "2"
version = "0.0.1"

[[bin]]
name = "{{ cookiecutter.project_slug }}"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[profile.dev.package."*"]
opt-level = 3

[dependencies]
# Basic ESP
esp-hal = { version = "1.1.0", features = ["{{ cookiecutter.esp_chip }}", "log-04", "unstable"] }
esp-backtrace = { version = "0.19.0", features = [
    "panic-handler",
    "println",
    "{{ cookiecutter.esp_chip }}"
] }
embassy-executor    = { version = "0.10.0" }
embassy-futures     = "0.1.1"
embassy-time        = "0.5.0"
esp-rtos = { version = "0.3.0", features = ["embassy", "{{ cookiecutter.esp_chip }}", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["{{ cookiecutter.esp_chip }}"] }
esp-println = { version = "0.17.0", features = ["log-04"] }
