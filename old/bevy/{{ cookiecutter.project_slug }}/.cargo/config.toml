# ---------------------------------------------------------------------------
# Compile-speed configuration. Everything here works on stable Rust.
# ---------------------------------------------------------------------------

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-C", "link-arg=-fuse-ld=mold",  # mold links a Bevy binary in well under a second
]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-C", "link-arg=-fuse-ld=mold",
]

# for Windows
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
