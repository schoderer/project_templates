default_job = "check"

[jobs.check]
command = ["cargo", "check", "--features", "dev", "--color", "always"]
need_stdout = false

[jobs.check-all]
command = ["cargo", "check", "--features", "dev", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--features", "dev", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--color", "always"]
need_stdout = true

[jobs.run]
command = ["cargo", "run", "--features", "dev", "--color", "always"]
need_stdout = true
allow_warnings = true

[keybindings]
c = "job:clippy"
a = "job:check-all"
r = "job:run"
t = "job:test"
