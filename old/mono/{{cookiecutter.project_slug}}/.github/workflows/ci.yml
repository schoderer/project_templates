name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        # One native runner per system in flake.nix; no emulation needed.
        runner:
{%- for system in cookiecutter.systems.split(",") %}
          - {{ {"x86_64-linux": "ubuntu-latest", "aarch64-linux": "ubuntu-24.04-arm"}[system] }}
{%- endfor %}
    runs-on: {% raw %}${{ matrix.runner }}{% endraw %}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}

      - name: Project locks match the root lock
        run: nix run .#sync-locks -- --check

      - name: Checks (clippy, tests, linters, formatting, builds)
        run: nix flake check -L

      - name: Build all binaries and docker images
        run: nix build -L .#default .#docker
