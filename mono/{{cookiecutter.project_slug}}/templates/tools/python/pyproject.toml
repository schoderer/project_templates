[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "__NAME__"
version = "0.1.0"
description = "__NAME__ tool"
requires-python = ">=3.12"
dependencies = ["click>=8"]

[project.scripts]
__NAME__ = "__NAME_SNAKE__.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/__NAME_SNAKE__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
