# `nix fmt` (or `treefmt` in the devShell) formats the project;
# `nix flake check` fails on unformatted files. The lib supplies nixfmt, taplo
# and gofmt; add `formatters = pkgs: [ … ];` in flake.nix for anything else.

# Don't warn about files no formatter claims (justfile, .gitignore, …).
on-unmatched = "debug"

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.go]
command = "gofmt"
options = ["-w"]
includes = ["*.go"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
